name: import-upstream

"on":
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Clone upstream
        run: git clone --depth 1 https://github.com/huangjunsen0406/mini-dsh.git ../upstream
      - name: Sync snapshot
        run: |
          rsync -a --delete --exclude='.git' ../upstream/ ./
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: sync upstream mini-dsh snapshot"
          git push origin HEAD:main
